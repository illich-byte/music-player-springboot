<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; }
        h2 { margin-top: 0; color: #333; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #45a049; }
        .error { color: red; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Реєстрація</h2>
    
    <div class="error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/register}" th:object="${user}" method="post">
        <label>Логін:</label>
        <input type="text" th:field="*{username}" required placeholder="Введіть логін"/>

        <label>Пароль:</label>
        <input type="password" th:field="*{password}" required placeholder="Введіть пароль"/>

        <button type="submit">Зареєструватися</button>
    </form>
    <p style="margin-top: 15px; font-size: 14px;"><a href="/">Назад до музики</a></p>
</div>

</body>
</html>
